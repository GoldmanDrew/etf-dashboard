name: Nightly Metrics & Full Build

# Morning ingest (ETF metrics, holdings, distributions, scoring) + full build_data.py
# in one commit/deploy. Replaces update-etf-metrics.yml + workflow_run chain into
# build-and-deploy.

on:
  schedule:
    # Two UTC slots cover 6 AM ET across DST (10 UTC = EDT, 11 UTC = EST).
    # resolve-slot keeps only the slot matching the current DST offset (delivery
    # can be hours late, so never gate on wall-clock hour); cancel-in-progress
    # MUST stay false or the 11 UTC placeholder run kills the in-flight ingest.
    - cron: "0 10 * * 1-6"
    - cron: "0 11 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "nightly-build"
  cancel-in-progress: false

jobs:
  resolve-slot:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.slot.outputs.run }}
      monday_catchup: ${{ steps.slot.outputs.monday_catchup }}
    steps:
      - name: Resolve 6 AM ET schedule slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch; running full pipeline."
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "monday_catchup=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SLOT=$(python - <<'PY'
          from datetime import datetime
          import pytz
          now_et = datetime.now(pytz.timezone("America/New_York"))
          print(f"{now_et.hour} {now_et.weekday()} {int(bool(now_et.dst()))}")
          PY
          )
          ET_HOUR=$(echo "$SLOT" | awk '{print $1}')
          ET_DOW=$(echo "$SLOT" | awk '{print $2}')
          ET_DST=$(echo "$SLOT" | awk '{print $3}')
          SCHED="${{ github.event.schedule }}"
          echo "Current ET hour=$ET_HOUR weekday(0=Mon)=$ET_DOW dst=$ET_DST cron=$SCHED"
          # Pick the cron slot that maps to 6 AM ET under the current UTC offset.
          # GitHub frequently delivers scheduled runs hours late, so gating on the
          # wall-clock hour silently skipped the entire ingest (no metrics for days).
          if [ "$SCHED" = "0 10 * * 1-6" ] && [ "$ET_DST" != "1" ]; then
            echo "10 UTC slot but EST in effect; the 11 UTC slot owns today."
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "monday_catchup=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$SCHED" = "0 11 * * 1-6" ] && [ "$ET_DST" = "1" ]; then
            echo "11 UTC slot but EDT in effect; the 10 UTC slot owns today."
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "monday_catchup=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$ET_DOW" -eq 6 ]; then
            echo "Sunday; skipping nightly."
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "monday_catchup=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          if [ "$ET_DOW" -eq 0 ]; then
            echo "Monday catch-up slot (multi-day ingest through prior Fri)."
            echo "monday_catchup=true" >> "$GITHUB_OUTPUT"
          else
            echo "monday_catchup=false" >> "$GITHUB_OUTPUT"
          fi

  nightly:
    needs: resolve-slot
    if: needs.resolve-slot.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Compute-only budget (ingest + repairs + build_data). Deploy runs in its own
    # isolated job so a slow/queued Pages deploy can never consume this budget.
    timeout-minutes: 350
    outputs:
      metrics_changed: ${{ steps.commit_metrics.outputs.changed }}
      dashboard_changed: ${{ steps.commit_dashboard.outputs.changed }}
    env:
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY || secrets.POLYGON_IO_API_KEY }}
      TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.LS_ALGO_TOKEN || secrets.GITHUB_TOKEN }}
      ETF_METRICS_HTTP_TIMEOUT_SEC: "30"
      ETF_METRICS_HTTP_RETRY_TOTAL: "3"
      ETF_METRICS_HTTP_RETRY_BACKOFF: "0.5"
      ETF_METRICS_MAX_STALE_BUSINESS_DAYS: "3"
      ETF_METRICS_SKIP_IF_RECENT_HOURS: ${{ github.event_name == 'schedule' && '8' || '0' }}
      ETF_METRICS_MONDAY_CATCHUP_BDAYS: "3"
      # Parallel single-day ticker ingest (default off in script; enabled in CI).
      ETF_METRICS_INGEST_WORKERS: "8"
      ETF_METRICS_INGEST_MIN_INTERVAL_SEC: "0.05"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Polygon key
        run: |
          if [ -z "${POLYGON_API_KEY}" ]; then
            echo "POLYGON_API_KEY (or POLYGON_IO_API_KEY) is missing in repo secrets."
            exit 1
          fi

      - name: Pull latest main
        run: git pull --ff-only origin main

      - name: Ingest ETF metrics
        run: |
          EXTRA=""
          if [ "${{ needs.resolve-slot.outputs.monday_catchup }}" = "true" ]; then
            EXTRA="--monday-catchup"
          fi
          python scripts/ingest_etf_metrics.py --lookback-days 10 --polygon-lookback-days 5 $EXTRA

      - name: Repair REX issuer NAV vs market close (tail)
        continue-on-error: true
        run: |
          # 45-day window only on the Monday catch-up run; 21 is enough to catch
          # recent issuer NAV/close divergences on a daily cadence and roughly
          # halves the per-ticker REX scrape cost.
          LB=21
          if [ "${{ needs.resolve-slot.outputs.monday_catchup }}" = "true" ]; then LB=45; fi
          python scripts/repair_rex_session_nav_close.py --lookback-days "$LB" --apply

      - name: Backfill underlying adj. close gaps
        continue-on-error: true
        run: python scripts/backfill_underlying_adj_close.py

      - name: Backfill historical close prices
        continue-on-error: true
        run: python scripts/backfill_close_prices.py --chunk 50

      - name: Backfill etf adj. close gaps
        continue-on-error: true
        run: python scripts/backfill_etf_adj_close.py

      - name: Audit metrics field gaps
        continue-on-error: true
        run: python scripts/audit_metrics_gaps.py --start $(python -c "from datetime import date,timedelta; print((date.today()-timedelta(days=14)).isoformat())")

      - name: Apply metrics gap easy fixes
        continue-on-error: true
        run: python scripts/audit_metrics_gaps.py --apply-easy-fixes

      - name: Repair stale issuer closes from market
        continue-on-error: true
        run: python scripts/repair_metrics_staleness.py --apply --skip-ingest --minimal --report-out data/metrics_staleness_report.json

      - name: Targeted metrics tail session catchup (Monday)
        if: needs.resolve-slot.outputs.monday_catchup == 'true'
        continue-on-error: true
        run: python scripts/repair_metrics_staleness.py --apply --targeted-catchup --min-days-behind 2 --report-out data/metrics_staleness_report.json

      - name: Audit Decay joint-usable coverage
        continue-on-error: true
        run: python scripts/audit_metrics_decay_coverage.py --report-out data/metrics_decay_coverage_report.json

      - name: Repair Decay coverage (CF → market_backed)
        continue-on-error: true
        run: |
          python scripts/repair_metrics_decay_coverage.py --apply --backfill-gaps \
            --report-out data/metrics_decay_repair_report.json \
            --coverage-out data/metrics_decay_coverage_report.json

      - name: Decay coverage gate (hard fail)
        run: python scripts/audit_metrics_decay_coverage.py --fail-on-tradeable-lag --report-out data/metrics_decay_coverage_report.json

      - name: Bootstrap Yahoo prices before first stored metrics row
        continue-on-error: true
        run: python scripts/bootstrap_metrics_yahoo_history.py --max-tickers 500

      - name: Ingest ETF distribution history
        run: python scripts/ingest_distributions.py --sleep 0.1

      - name: Score NAV forecasts and refresh anchors
        continue-on-error: true
        run: |
          python scripts/score_nav_forecasts.py
          python scripts/repair_nav_forecast_stale_spots.py --apply

      - name: Build LETF rebalance flows
        run: python scripts/build_letf_rebalance_flows.py

      - name: Freshness diagnostics
        continue-on-error: true
        run: python scripts/freshness_diagnostics.py --max-underlying-hours 48 --max-flow-stale-pct 25 --fail-on-violations

      - name: Alert on freshness violations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/alert_freshness.py

      - name: Repair REX NAV when freshness flags divergence
        continue-on-error: true
        run: |
          LB=21
          if [ "${{ needs.resolve-slot.outputs.monday_catchup }}" = "true" ]; then LB=45; fi
          python - "$LB" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          lb = sys.argv[1]
          p = Path('data/freshness_summary.json')
          if not p.exists():
              raise SystemExit(0)
          v = json.loads(p.read_text()).get('violations') or []
          if any('rex' in str(x).lower() for x in v):
              subprocess.check_call(['python', 'scripts/repair_rex_session_nav_close.py', '--lookback-days', lb, '--apply'])
          PY

      - name: FoF pipeline diagnostics
        continue-on-error: true
        run: python scripts/fof_pipeline_diagnostics.py --report data/fof_pipeline_report.json

      - name: Earnings seed weekly refresh (Monday)
        if: needs.resolve-slot.outputs.monday_catchup == 'true'
        continue-on-error: true
        run: python scripts/refresh_earnings_seed.py --refresh --report data/earnings_seed_audit.json

      - name: Earnings seed audit
        if: needs.resolve-slot.outputs.monday_catchup != 'true'
        continue-on-error: true
        run: python scripts/refresh_earnings_seed.py --report data/earnings_seed_audit.json

      - name: Backfill FoF NAV history
        continue-on-error: true
        run: python scripts/backfill_fof_metrics.py

      - name: Score intraday LETF flow estimates vs realised
        continue-on-error: true
        run: python scripts/score_intraday_flows.py

      - name: Backtest intraday remaining heuristics
        continue-on-error: true
        run: python scripts/backtest_intraday_remaining.py

      - name: Ingest event calendar
        continue-on-error: true
        run: python scripts/ingest_event_calendar.py

      - name: Refresh corporate actions if stale
        continue-on-error: true
        run: python scripts/ensure_corporate_actions_fresh.py --max-age-hours 6

      # Persist metrics/scoring before the long build_data step so a timeout or
      # build failure does not leave issuer NAV backfills stranded in the runner.
      - name: Commit metrics and scoring artifacts
        id: commit_metrics
        uses: ./.github/actions/commit-data
        with:
          files: >-
            data/etf_metrics_daily.parquet
            data/etf_metrics_daily.csv
            data/etf_metrics_latest.json
            data/etf_metrics_health.json
            data/etf_distributions.json
            data/etf_holdings_daily.parquet
            data/etf_holdings_latest.csv
            data/etf_holdings_latest.json
            data/nav_forecasts/_anchors.json
            data/nav_forecasts/_metrics_daily.json
            data/nav_forecasts/_history_panel.json
            data/nav_forecasts/realized
            data/letf_rebalance_flows_daily.parquet
            data/letf_rebalance_flows_daily.json
            data/letf_rebalance_flows_latest.json
            data/underlying_volume_history.parquet
            data/letf_intraday_flow_realized.jsonl
            data/letf_intraday_flow_metrics.json
            data/letf_intraday_remaining_backtest.json
            data/freshness_summary.json
            data/fof_pipeline_report.json
            data/metrics_staleness_report.json
            data/metrics_decay_coverage_report.json
            data/metrics_decay_coverage_summary.csv
            data/metrics_decay_repair_report.json
            data/earnings_seed_audit.json
            data/earnings_calendar_seed.json
          commit_message: "${{ needs.resolve-slot.outputs.monday_catchup == 'true' && 'chore: monday metrics catch-up ingest' || 'chore: nightly metrics ingest' }}"

      - name: Full dashboard build
        id: build_data
        continue-on-error: true
        env:
          POLYGON_OPTIONS_MAX_SYMBOLS: "100"
          POLYGON_MAX_REQUESTS_PER_MINUTE: "25"
          POLYGON_MAX_TOTAL_REQUESTS: "90"
          OPTIONS_SYMBOLS_PER_RUN: "16"
          OPTIONS_SHARD_COUNT: "12"
          OPTIONS_SHARD_INTERVAL_MINUTES: "3"
          OPTIONS_ONLY_BUCKET3: "1"
          OPTIONS_INCLUDE_BUCKET3_UNDERLYING: "1"
          OPTIONS_ACCUMULATE_CACHE: "1"
          TRADIER_MAX_TOTAL_REQUESTS: "500"
          TRADIER_CHAIN_MAX_TOTAL_REQUESTS: "400"
          TRADIER_CHAIN_SYMBOLS: "MSTU,MULL,TECL,TSLL"
        run: python scripts/build_data.py

      - name: Checkout ls-algo (Bucket 4/5 backtests)
        if: steps.build_data.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: GoldmanDrew/ls-algo
          ref: main
          path: ls-algo
          token: ${{ secrets.LS_ALGO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install ls-algo deps (Bucket 4/5)
        if: steps.build_data.outcome == 'success'
        run: pip install -r ls-algo/requirements.txt

      - name: Build Bucket 5 product dashboard
        if: steps.build_data.outcome == 'success'
        continue-on-error: true
        run: |
          # Prefer copying a prebuilt product JSON from ls-algo; otherwise build --quick.
          if [ -f ls-algo/risk_dashboard/data/bucket5_product.json ]; then
            python scripts/build_bucket5_product.py --copy-ls-algo-panel
          else
            python scripts/build_bucket5_product.py --quick
          fi

      - name: Build Bucket 4 inverse-decay backtest artifact
        if: steps.build_data.outcome == 'success'
        env:
          LS_ALGO_ROOT: ${{ github.workspace }}/ls-algo
        run: |
          # The nightly run is before the US session. Replay only through the
          # last completed weekday; do not publish an intraday/partial ledger.
          RUN_DATE="$(python - <<'PY'
          from datetime import datetime, timedelta, timezone
          day = datetime.now(timezone.utc).date() - timedelta(days=1)
          while day.weekday() >= 5:
              day -= timedelta(days=1)
          print(day.isoformat())
          PY
          )"
          python ls-algo/scripts/export_b4_dashboard.py --run-production --run-date "$RUN_DATE" --start 2026-02-27
          python scripts/build_bucket4_backtest.py --mode production --max-age-days 4

      - name: Bucket 4 Layer A twin unit tests
        if: steps.build_data.outcome == 'success'
        continue-on-error: true
        run: python -m pytest tests/test_b4_layer_a_parity.py -q

      - name: Bucket 4 research nest audit (fail-closed)
        if: steps.build_data.outcome == 'success'
        run: python scripts/audit_b4_inception_paths.py --fail-on-missing-nests

      - name: Bucket 4 inception path audit (soft)
        if: steps.build_data.outcome == 'success'
        continue-on-error: true
        run: python scripts/audit_b4_inception_paths.py --fail-on-inception-fail

      - name: Refresh YieldBOOST VRP (sleeves + Tradier OCC)
        if: steps.build_data.outcome == 'success'
        continue-on-error: true
        env:
          YIELDBOOST_OPTIONS_MAX_SYMBOLS: "40"
          OPTIONS_SYMBOLS_PER_RUN: "40"
          OPTIONS_SHARD_COUNT: "1"
          OPTIONS_ACCUMULATE_CACHE: "1"
          OPTIONS_INCLUDE_YIELDBOOST: "1"
          OPTIONS_ONLY_BUCKET3: "0"
          POLYGON_MAX_REQUESTS_PER_MINUTE: "25"
          POLYGON_MAX_TOTAL_REQUESTS: "120"
          TRADIER_MAX_TOTAL_REQUESTS: "500"
          TRADIER_CHAIN_MAX_TOTAL_REQUESTS: "400"
          TRADIER_CHAIN_SYMBOLS: "MSTU,MULL,TECL,TSLL"
          YIELDBOOST_OCC_QUOTES_MAX_REQUESTS: "32"
        run: python scripts/build_data.py --yieldboost-vrp-only

      - name: Score borrow spike predictions
        if: steps.build_data.outcome == 'success'
        continue-on-error: true
        run: python scripts/score_borrow_spikes.py --rescore-all

      - name: Replay borrow spike model (v1 L0 + v2 L2)
        if: steps.build_data.outcome == 'success'
        continue-on-error: true
        run: python scripts/borrow_spike_pipeline.py --skip-scorer

      - name: Borrow spike accuracy gate (L2)
        if: steps.build_data.outcome == 'success'
        continue-on-error: true
        run: python scripts/analyze_borrow_spike_accuracy.py --fail-below-floor

      - name: Build borrow predictor panel
        if: steps.build_data.outcome == 'success'
        continue-on-error: true
        run: python scripts/build_borrow_predictor_panel.py

      - name: Analyze borrow predictors
        if: steps.build_data.outcome == 'success'
        continue-on-error: true
        run: python scripts/analyze_borrow_predictors.py --fail-if-no-panel

      - name: Split TR quality audit
        if: steps.build_data.outcome == 'success'
        run: python scripts/audit_split_tr_quality.py --strict-bucket-1 --audit-underlying-cliffs

      - name: Dashboard data quality audit
        if: steps.build_data.outcome == 'success'
        continue-on-error: true
        run: python scripts/audit_dashboard_data_quality.py --report "${{ runner.temp }}/dashboard_audit.json"

      - name: Upload dashboard audit artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/dashboard_audit.json
          if-no-files-found: ignore

      - name: Commit dashboard build artifacts
        if: steps.build_data.outcome == 'success'
        id: commit_dashboard
        uses: ./.github/actions/commit-data
        with:
          files: >-
            data/dashboard_data.json
            data/etf_screened_today.csv
            data/borrow_history.json
            data/borrow_spike_risk.json
            data/borrow_spike_predictions
            data/borrow_spike_realized.jsonl
            data/borrow_spike_metrics.json
            data/borrow_spike_replay_panel.parquet
            data/borrow_spike_replay_l2_panel.parquet
            data/borrow_spike_replay_summary.json
            data/borrow_spike_eval.json
            data/borrow_spike_tracking.json
            data/borrow_forecast_latest.json
            data/borrow_predictor_panel.parquet
            data/borrow_predictor_panel_meta.json
            data/borrow_predictor_leadlag.json
            data/borrow_feature_importance.json
            data/borrow_predictor_study_summary.json
            data/options_cache.json
            data/vol_shape_history.json
            data/vrp_live.json
            data/vrp_health.json
            data/yieldboost_put_spreads_latest.json
            data/yieldboost_options_target.json
            data/event_calendar_known.json
            data/event_calendar_inferred.json
            data/event_calendar_combined.json
            data/ci_state.json
            data/product_taxonomy.json
            data/fof_pipeline_report.json
            data/earnings_seed_audit.json
            data/bucket4_backtest.json
            data/bucket4_backtest_state.json
            data/bucket4_backtest_policy_hash.txt
            data/bucket4_pairs
            data/bucket5_insurance_backtest.json
          commit_message: "${{ needs.resolve-slot.outputs.monday_catchup == 'true' && 'chore: monday dashboard catch-up build' || 'chore: nightly dashboard build' }}"

  # Read-only, non-gating diagnostics run in parallel with the Pages deploy so
  # they no longer sit on the critical path before publishing. Hard quality
  # gates (Split TR + Dashboard data quality) stay inside the compute job.
  audits:
    needs: nightly
    if: needs.nightly.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY || secrets.POLYGON_IO_API_KEY }}
      TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.LS_ALGO_TOKEN || secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: options-vrp
            run: |
              python scripts/options_cache_diagnostics.py --path data/options_cache.json --fail-when-both-zero || true
              python scripts/vrp_pipeline_diagnostics.py --require-vrp-file --fail-on-missing-vrp-when-spreads || true
          - name: distribution-split-basis
            run: python scripts/audit_distribution_split_basis.py
          - name: exp-etf-scenario-alignment
            run: python scripts/audit_exp_etf_scenario_alignment.py --strict-only --warn
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest main
        run: git pull --ff-only origin main

      - name: Run diagnostic (${{ matrix.name }})
        continue-on-error: true
        run: ${{ matrix.run }}

  # Isolated Pages deploy. Runs on its own runner/budget so a queued or
  # superseded Pages deployment can never eat the compute job's time limit
  # (the failure mode that timed out both nightly runs). The shared
  # "pages-deploy" concurrency group serializes this against the hourly
  # safety net + build-and-deploy so deployments never supersede each other,
  # and fail-soft leaves the hourly net (deploy-pages-data.yml) as backstop.
  deploy:
    needs: nightly
    if: needs.nightly.result == 'success' && (needs.nightly.outputs.metrics_changed == '1' || needs.nightly.outputs.dashboard_changed == '1')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: "pages-deploy"
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          lfs: true

      - name: Pull latest main
        run: git pull --ff-only origin main

      - name: Deploy Pages
        uses: ./.github/actions/deploy-pages
        with:
          fail-soft: "true"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
