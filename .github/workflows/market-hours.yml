name: Market Hours Data Tick

# Single orchestrator for borrow / options / YieldBOOST VRP / intraday / NAV forecast.
# Replaces refresh-borrow, refresh-options (A/B), refresh-yieldboost-vrp,
# intraday-flow, and refresh-nav-forecast.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Task mode (auto, borrow, options, yieldboost, intraday, nav)"
        required: false
        default: auto
      force:
        description: "Run even if staleness gate would skip"
        required: false
        default: "false"

permissions:
  contents: write
  issues: write

concurrency:
  group: "market-hours-tick"
  cancel-in-progress: true

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      deploy: ${{ steps.commit.outputs.changed == '1' }}
    env:
      NAV_FORECAST_APPLY_DISTRIBUTION: "1"
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY || secrets.POLYGON_IO_API_KEY }}
      TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.LS_ALGO_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run CI tick
        id: tick
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          python scripts/ci_tick.py --mode "$MODE" $FORCE_FLAG

      - name: Options / VRP diagnostics
        if: steps.tick.outputs.skipped != 'true' && (steps.tick.outputs.task == 'options' || steps.tick.outputs.task == 'yieldboost')
        continue-on-error: true
        run: |
          python scripts/options_cache_diagnostics.py --path data/options_cache.json --fail-when-both-zero
          python scripts/vrp_pipeline_diagnostics.py --require-vrp-file --fail-on-missing-vrp-when-spreads || true
          python scripts/vrp_pipeline_diagnostics.py --require-vrp-file --fail-on-low-iv-coverage || true
          python scripts/vrp_pipeline_diagnostics.py --require-vrp-file --fail-on-low-mid-coverage || true

      - name: Freshness diagnostics (market tick)
        if: steps.tick.outputs.skipped != 'true'
        continue-on-error: true
        run: |
          python scripts/freshness_diagnostics.py --quiet
          python scripts/alert_freshness.py || true

      # Deterministic content gate: validates exactly the files the tick wants to
      # commit (parse strictness incl. NaN tokens, schema keys, record-count and
      # build_time regression vs HEAD, per-ticker anomalies). BLOCK-severity
      # artifacts are dropped from the commit list; healthy artifacts plus
      # data/quarantine.json + data/sentinel_report.json still commit. NOT
      # continue-on-error by design — a sentinel crash fails closed (no commit,
      # next tick retries). Set repo variable SENTINEL_MODE=report to observe
      # without enforcement. Runbook: docs/data-health-sentinel.md
      - name: Data sentinel gate
        id: sentinel
        if: steps.tick.outputs.skipped != 'true' && steps.tick.outputs.files != ''
        env:
          SENTINEL_MODE: ${{ vars.SENTINEL_MODE || 'enforce' }}
        run: |
          python scripts/data_sentinel.py gate \
            --task "${{ steps.tick.outputs.task }}" \
            --files "${{ steps.tick.outputs.files }}"

      # Warn-only verdicts are alerted by the 3x/day sweep, not by every 15-min
      # tick — otherwise a persistent warn would spam the ops issue ~96x/day.
      - name: Sentinel alert (non-blocking)
        if: steps.sentinel.outputs.verdict == 'block' || steps.sentinel.outputs.verdict == 'quarantine'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/data_sentinel.py alert

      - name: Commit data if changed
        if: steps.tick.outputs.skipped != 'true' && steps.sentinel.outputs.files != ''
        id: commit
        uses: ./.github/actions/commit-data
        with:
          files: ${{ steps.sentinel.outputs.files }}
          commit_message: "chore: market tick (${{ steps.tick.outputs.task }})"

  deploy:
    needs: tick
    if: needs.tick.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: "pages-deploy"
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          lfs: true

      - name: Pull latest main
        run: git pull --ff-only origin main

      - name: Deploy Pages
        uses: ./.github/actions/deploy-pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.LS_ALGO_TOKEN || secrets.GITHUB_TOKEN }}
