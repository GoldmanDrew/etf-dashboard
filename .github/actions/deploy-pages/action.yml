name: Deploy Cloudflare Pages
description: Build _site from index.html + data/ + assets/ and publish to Cloudflare Pages
inputs:
  fail-soft:
    description: When true, do not fail the job if deploy fails
    required: false
    default: "false"
  project-name:
    description: Cloudflare Pages project name
    required: false
    default: etf-dashboard
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Materialize deploy-only data artifacts
      shell: bash
      run: |
        set -euo pipefail
        pip install -q pyarrow pandas numpy
        if [ -f data/etf_metrics_daily.parquet ]; then
          # Ship gzip only — plain JSON (~164 MB) exceeds Cloudflare's ~25 MiB file limit.
          python scripts/export_etf_metrics_daily_json.py --skip-plain-json
        else
          echo "No etf_metrics_daily.parquet; skipping JSON materialization"
        fi
        if [ -f data/vol_shape_history.json ] && [ ! -f data/vol_shape_history.json.gz ]; then
          python -c "import sys; from pathlib import Path; sys.path.insert(0,'scripts'); from etf_metrics_format import gzip_json_file; p=Path('data/vol_shape_history.json'); o=gzip_json_file(p); print(f'Wrote {o} ({o.stat().st_size/(1024*1024):.1f} MB)')"
        fi

    - name: Build site artifact
      shell: bash
      run: |
        set -euo pipefail
        rm -rf _site
        mkdir -p _site/data
        cp index.html _site/
        [ -d assets ] && cp -r assets _site/ || true
        # Pages rejects files > 25 MiB; keep a safety margin.
        if [ -d data ]; then
          find data -type f ! -name '*.parquet' ! -name '*.arrow' -size -20M -print0 |
            while IFS= read -r -d '' f; do
              rel="${f#data/}"
              mkdir -p "_site/data/$(dirname "$rel")"
              cp "$f" "_site/data/$rel"
            done
        fi

    - name: Audit Pages artifact budget
      shell: bash
      run: |
        set -euo pipefail
        python scripts/audit_pages_artifact_budget.py --site _site

    - name: Deploy to Cloudflare Pages
      id: deploy_pages
      shell: bash
      continue-on-error: ${{ inputs.fail-soft == 'true' }}
      env:
        PROJECT_NAME: ${{ inputs.project-name }}
      run: |
        set -euo pipefail
        if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
          echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID (pass via env on the action step)"
          exit 1
        fi
        npx --yes wrangler@4 pages deploy _site \
          --project-name="$PROJECT_NAME" \
          --branch=main \
          --commit-dirty=true
        echo "Deployed Cloudflare Pages project $PROJECT_NAME" >> "$GITHUB_STEP_SUMMARY"
