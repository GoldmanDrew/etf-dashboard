name: Deploy GitHub Pages
description: Build _site from index.html + data/ + assets/ and publish to GitHub Pages
inputs:
  fail-soft:
    description: When true, the final deploy step uses continue-on-error
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Materialize deploy-only data artifacts
      shell: bash
      run: |
        set -euo pipefail
        pip install -q pyarrow pandas numpy
        if [ -f data/etf_metrics_daily.parquet ]; then
          python scripts/export_etf_metrics_daily_json.py
        else
          echo "No etf_metrics_daily.parquet; skipping JSON materialization"
        fi

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Build site artifact
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p _site
        cp index.html _site/
        cp -r data _site/
        [ -d assets ] && cp -r assets _site/ || true

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

    - name: Wait for Pages deploy slot
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        MAX_WAIT_SEC: "1200"
      run: bash scripts/wait_for_pages_deploy_idle.sh

    - name: Deploy to GitHub Pages
      id: deploy_pages
      continue-on-error: ${{ inputs.fail-soft == 'true' }}
      uses: actions/deploy-pages@v4
      with:
        timeout: 1200000

    - name: Retry Pages deploy after idle wait
      if: steps.deploy_pages.outcome == 'failure' && inputs.fail-soft != 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        MAX_WAIT_SEC: "600"
      run: bash scripts/wait_for_pages_deploy_idle.sh

    - name: Deploy to GitHub Pages (retry)
      if: steps.deploy_pages.outcome == 'failure' && inputs.fail-soft != 'true'
      uses: actions/deploy-pages@v4
      with:
        timeout: 1200000
