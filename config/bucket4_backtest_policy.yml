# RESEARCH-ONLY snapshot used by `build_bucket4_backtest.py --mode research-legacy`.
# Production B4 comes exclusively from the authoritative ls-algo replay export;
# this file must never be used as a production fallback or parity assertion.
# Historical snapshot of ls-algo Bucket 4 rules (2026-07-11).
# Source: config/strategy_config.yml inverse_decay_bucket4
# Sizing: v6 opt2 (decay/borrow/cov) + crash_budget (trim then scale_to_budget,
#         asymmetric L EMA) + POST-CAP trim-only weight_smoothing (entry ramp +
#         no-trade band) + grow-only ratchet on the walk-forward path.

schema: bucket4_backtest_policy.v1
snapshot_date: "2026-07-11"

inverse_decay_bucket4:
  enabled: true
  target_weight: 0.03
  rules:
    partial_hedge_ratio: 1.0
    bucket4_weekly_opt2:
      enabled: true
      history_start: "2018-01-01"
      warmup_bdays: 65
      fee_bps: 1.0
      slippage_bps: 20.0
      borrow_multiplier: 1.0
      pf_min_pairs: 5
      decay_borrow_quad: 0
      borrow_linear_aversion: 1.5
      borrow_uncertainty_penalty: 3.0
      borrow_aversion_source: posterior
      # Continuous high-borrow ramp (same as live GTP / V6PfParams).
      borrow_ramp_lo: 0.80
      borrow_ramp_hi: 1.20
      min_weight: 0.005
      max_weight: 0.35
      cov_penalty: 0.85
      cov_shrink: 0.35
      vol_etp_weight_penalty: 0.0
      # Trim-only EMA applied AFTER the crash budget (live GTP Phase 5+):
      # cuts immediate, increases smoothed, new entries ramp from zero,
      # sub-band moves held (no churn).
      weight_smoothing:
        enabled: true
        alpha: 0.5
        ramp_new_entries: true
        entry_alpha: 0.25
        dilution_alpha: 0.25
        soft_exit_alpha: 0.35
        hard_cut_rel: 0.10
        no_trade_band_rel: 0.15
        no_trade_band_abs: 0.0025
        state_json: data/b4_weight_ema_state.json
      crash_budget:
        enabled: true
        # Relative crash-loss scale; scale_to_budget refills the 3% sleeve target.
        rho: 0.0075
        scale_to_budget: true
        theta: 0.5
        phi: 0.5
        l_floor: 0.02
        missing_policy: book_quantile
        missing_l_quantile: 0.75
        # Asymmetric per-name L EMA: risk-up immediate, risk-down smoothed.
        l_ema_alpha: 0.4
      hedge_cadence_policy:
        source: tr_vcr
        hedge_ratio_model: v7
        opt2_k: 0.05
        h_mid: 0.45
        k_vcr: 1.0
        h_min: 0.30
        h_max: 0.80
        alpha: 0.25
        k_z: 0.20
        cadence_signal_col: tr_est
        base_days: 14.0
        k_tr: -1.0
        m_vcr: 2.5
        min_interval: 1
        max_interval: 21
        operator_check_days: 5
        force_on_max_interval: true
        name_tilt: {}
      # Skip scheduled rebalances when share-of-gross drift is below this.
      # Matches production operator cadence gate spirit (share-space).
      drift_threshold_share_of_gross: 0.02
    ratchet:
      enabled: true
      state_json: data/b4_inverse_ratchet_state.json
      reconcile_tolerance_usd: 250.0
      trim:
        enabled: true
        trim_max: 0.5
        creep_full: 1.0
        k_edge: 0.3
        edge_floor: 0.25
        k_borrow: 0.0
        edge_ref: 0.30
        borrow_ref: 0.30
      release_below_edge: null
    min_net_edge_annual: 0.30
    min_underlying_vol: 0.40
    min_underlying_vol_entry: 0.50
    min_underlying_vol_keep: 0.40
    concentration:
      enabled: false
      top_n_pairs: 15
    cluster_caps:
      crypto:
        cap: 0.35
        members: [MSTR, COIN, IBIT, CLSK, IREN, BMNR, CRCL, RIOT, MARA, XRPZ, BLSH]
    excluded_etfs:
      - KOLD
      - SCO
    weighting:
      max_name_weight: 0.20
      eq_blend: 0.05
      borrow_aversion: 0.75

bucket_4:
  label: inverse_decay
  screener_buckets: ["bucket_4"]
  target_weight: 0.30
  rules:
    partial_hedge_ratio: 1.0
    min_abs_beta: 0.5
    max_borrow_current: 1.20
    min_underlying_vol: 0.05
    max_pair_weight: 0.18
    max_underlying_weight: 0.30
    exclude_purgatory: true

bucket_4_dynamic_hedge:
  state_path: data/b4_hedge_state.json
  h_base: 0.75
  k: 0.05
  alpha: 0.25
  h_min: 0.10
  h_max: 1.10
  min_names: 5

bucket_4_ratchet:
  enabled: true
  state_json: data/b4_inverse_ratchet_state.json
  reconcile_tolerance_usd: 250.0
  trim:
    enabled: true
    trim_max: 0.5
    creep_full: 1.0
    k_edge: 0.3
    edge_floor: 0.25
    k_borrow: 0.0
    edge_ref: 0.30
    borrow_ref: 0.30
  release_below_edge: null

backtest:
  start: "2024-01-01"
  min_days: 60
  warmup_bdays: 60
  signal_window: 60
  initial_capital: 1.0
  gross_multiplier: 1.0
  sleeve_budget_usd: 100000.0
  sizing_method: v6_opt2_crash_budget
  walk_forward: true
  rebalance_freq: W-FRI
  # Point-in-time: override borrow from borrow_history.json as-of each Friday;
  # drop names whose as-of borrow exceeds max_borrow_current.
  pit_borrow: true
  # Custom-book presets (equal / edge) scale to this deployed fraction so they
  # do not silently 100%-deploy vs production cash residual.
  custom_book_match_deployed_fraction: true
