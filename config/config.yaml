# ──────────────────────────────────────────────
# ETF Borrow Dashboard — Configuration
# ──────────────────────────────────────────────

# ── Data files ───────────────────────────────
universe_csv: "data/etf_screened_today.csv"
inverse_etf_csv: "config/inverse_etfs.csv"

# ── GitHub sync (pull latest universe from ls-algo repo) ──
github:
  enabled: true
  repo: "GoldmanDrew/ls-algo"
  branch: "main"
  remote_path: "data/etf_screened_today.csv"
  # token: ""              # optional: set here or via GITHUB_TOKEN env var
  #                        # required for private source repos
  sync_on_startup: true    # pull latest on server start
  sync_interval_seconds: 3600   # re-sync every hour (0 = disabled)
  backup_dir: "data/universe_history"  # keep dated backups of old CSVs
  # !! NOTE: a second `github:` block further down this file overrides this one
  # !! entirely (YAML duplicate key — last wins). Edit that block, not this one.

# ── IBKR connection ─────────────────────────
ibkr:
  ftp_host: "ftp2.interactivebrokers.com"
  ftp_user: "shortstock"
  ftp_pass: ""
  filename: "usa.txt"
  use_mock: true          # set false to fetch live from IBKR FTP

# ── Refresh cadence ─────────────────────────
refresh:
  borrow_interval_seconds: 1800   # refresh borrow + shares every 30 minutes
  decay_interval_seconds: 86400   # daily decay recalc
  stale_threshold_seconds: 3600   # mark data stale after 60 min

# ── Bucket thresholds ───────────────────────
buckets:
  high_delta_threshold: 1.5        # Beta > this → Bucket 1

# ── Analytics ────────────────────────────────
analytics:
  trading_days: 252
  default_borrow_annual: 0.05
  decay_windows_months: [3, 6, 12]

# ── Server ───────────────────────────────────
server:
  host: "0.0.0.0"
  port: 8000

# ── Database ─────────────────────────────────
database:
  path: "data/dashboard.db"

# ── GitHub Universe Sync ─────────────────────
github:
  enabled: true
  repo: "GoldmanDrew/ls-algo"
  branch: "main"
  remote_path: "data/etf_screened_today.csv"
  backup_dir: "data/universe_history"
  sync_on_startup: true
  sync_interval_seconds: 3600   # re-pull every hour
  # token: null                 # set for private repos or higher rate limits
                                # or use GITHUB_TOKEN env var
  # Additional artifacts pulled from the same repo/branch on the same schedule.
  # Each failure is caught independently so a side-car panel can never block or
  # invalidate the universe sync above.
  #   Bucket 6 watch panel — single-stock autocallable ETFs, watch-only telemetry
  #   written by ls-algo scripts/bucket6_watch.py. Field contract:
  #   that repo's docs/Bucket6_Dashboard_Data_Spec.pdf
  extra_files:
    - remote_path: "data/bucket6_watch.json"
      local_path: "data/bucket6_watch.json"

# ── Blacklist (symbols to exclude) ───────────
blacklist: []
